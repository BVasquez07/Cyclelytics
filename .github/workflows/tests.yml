name: Tests with Allure Report

on: [push, pull_request]

permissions:
  contents: write

jobs:
  test_and_generate_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run tests with allure
        run: uv run pytest --alluredir=./allure-results
        continue-on-error: true
      
      - name: Install allure-commandline
        if: always()
        run: npm install -g allure-commandline
      
      - name: Generate allure report
        if: always()
        run: allure generate ./allure-results -o ./allure-report --clean
      
      - name: Create README for reporting branch
        if: always()
        run: |
          cat > ./allure-report/README.md << 'EOF'
          # Allure Test Reports
          
          This branch (`allure-reports`) is **automatically maintained** and contains test reports generated by CI/CD.
          
          **Do not commit directly to this branch.**
          
          - Reports are auto-generated from test runs on the `main` branch
          - Hosted via GitHub Pages at: https://BVasquez07.github.io/Cyclelytics/
          - Latest report reflects the most recent test execution
          
          ## Technologies
          
          - **GitHub Actions** - CI/CD Automation
          - **pytest** - Test execution framework
          - **pytest-asyncio** - Async test support
          - **allure-pytest** - Test reporting plugin
          - **Allure CommandLine** - HTML report generation
          - **uv** - Python package manager & dependency management
          - **GitHub Pages** - Report hosting
          
          Generated automatically on every push/merge to `main`.
          EOF
      
      - name: Upload report to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
      
      - name: Deploy report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: allure-reports
